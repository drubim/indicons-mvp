<h2>Cadastro de Indicador</h2>

<input id="nome" placeholder="Nome"><br>
<input id="email" placeholder="Email"><br>
<input id="telefone" placeholder="Telefone"><br>
<input id="senha" placeholder="Senha"><br>
<button onclick="cadastrar()">Cadastrar</button>

<script>
function cadastrar() {
  fetch("/api/indicadores", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      nome: nome.value,
      email: email.value,
      telefone: telefone.value,
      senha: senha.value
    })
  })
  .then(r => r.json())
  .then(d => alert("Cadastro ok. Código: " + d.codigo_indicador));
}
</script>
