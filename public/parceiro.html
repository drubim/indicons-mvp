<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>INDICONS · Parceiro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 20px; }
h1 { margin-bottom: 20px; }

table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #e5e7eb;
  text-align: left;
}

th {
  background: #111827;
  color: #fff;
}
</style>
</head>

<body>

<h1>Leads para atendimento</h1>

<table>
  <thead>
    <tr>
      <th>Cliente</th>
      <th>Indicador</th>
      <th>Status</th>
      <th>IA</th>
    </tr>
  </thead>
  <tbody id="leads">
    <tr><td colspan="4">Carregando...</td></tr>
  </tbody>
</table>

<script>
fetch('/parceiro/leads')
  .then(r => r.json())
  .then(leads => {
    const tbody = document.getElementById('leads');
    tbody.innerHTML = '';

    if (leads.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="4">Nenhum lead disponível</td></tr>';
      return;
    }

    leads.forEach(l => {
      tbody.innerHTML += `
        <tr>
          <td>${l.nome}</td>
          <td>${l.indicadorNome}</td>
          <td>${l.status}</td>
          <td>${l.classificacaoIA}</td>
        </tr>`;
    });
  });
</script>

</body>
</html>
