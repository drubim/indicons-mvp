<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Parceiro | INDICONS</title>
  <link rel="stylesheet" href="/parceiro.css">
</head>
<body>

<header>
  <h1>INDICONS · Parceiro</h1>
</header>

<main class="box">
  <h2>Leads Qualificados</h2>

  <table>
    <thead>
      <tr>
        <th>Cliente</th>
        <th>Indicador</th>
        <th>Classificação</th>
        <th>Status</th>
        <th>Reunião</th>
      </tr>
    </thead>
    <tbody id="leads">
      <tr><td colspan="5">Carregando...</td></tr>
    </tbody>
  </table>
</main>

<script>
fetch('/parceiro/leads')
  .then(r => r.json())
  .then(leads => {
    const tbody = document.getElementById('leads');
    tbody.innerHTML = '';

    leads.forEach(l => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${l.nome}</td>
        <td>${l.indicadorNome}</td>
        <td>${l.classificacaoIA}</td>
        <td>${l.status}</td>
        <td>${l.linkReuniao ? `<a href="${l.linkReuniao}" target="_blank">Abrir Meet</a>` : '-'}</td>
      `;
      tbody.appendChild(tr);
    });
  });
</script>

</body>
</html>
