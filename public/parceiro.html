<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Parceiro</title>
</head>
<body>

<h2>Leads</h2>

<table border="1" width="100%">
  <thead>
    <tr>
      <th>Cliente</th>
      <th>Indicador</th>
      <th>Status</th>
      <th>Valor Consórcio</th>
      <th>Ação</th>
    </tr>
  </thead>
  <tbody id="lista"></tbody>
</table>

<script>
fetch('/parceiro/leads')
  .then(r => r.json())
  .then(leads => {
    const tbody = document.getElementById('lista');
    tbody.innerHTML = '';

    leads.forEach(l => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${l.nome}</td>
        <td>${l.indicadorNome}</td>
        <td>${l.status}</td>
        <td>
          <input type="number" id="v${l.id}" placeholder="Ex: 120000">
        </td>
        <td>
          <button onclick="vender(${l.id})">Marcar vendido</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  });

function vender(id) {
  const valor = document.getElementById('v' + id).value;
  if (!valor) return alert('Informe o valor');

  fetch('/lead/vendido', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, valorVenda: valor })
  }).then(() => location.reload());
}
</script>

</body>
</html>
