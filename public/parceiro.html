<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Parceiro | INDICONS</title>
</head>
<body>

<h2>Painel do Parceiro</h2>
<p>Leads qualificados e já agendados</p>

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>Cliente</th>
      <th>WhatsApp</th>
      <th>Indicador</th>
      <th>Horário</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody id="lista"></tbody>
</table>

<script>
fetch('/parceiro/leads')
  .then(res => res.json())
  .then(leads => {
    const tbody = document.getElementById('lista');

    if (leads.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6">Nenhum lead em atendimento</td></tr>';
      return;
    }

    leads.forEach(l => {
      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td>${l.nome}</td>
        <td>${l.whatsapp}</td>
        <td>${l.indicadorNome || '-'}</td>
        <td>${l.horarioAgendado || 'A definir'}</td>
        <td>🔵 Em atendimento</td>
        <td>
          <button onclick="atualizar(${l.id}, 'Venda concluída')">🟢 Vendeu</button>
          <button onclick="atualizar(${l.id}, 'Não avançou')">🔴 Não avançou</button>
        </td>
      `;

      tbody.appendChild(tr);
    });
  });

function atualizar(id, status) {
  fetch('/parceiro/status', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, status })
  })
  .then(() => location.reload());
}
</script>

</body>
</html>
