<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Criar conta | INDICONS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="container header-flex">
    <div class="logo">INDICONS</div>
    <nav>
      <a href="/">Home</a>
      <a href="/simulador.html">Simulador</a>
      <a href="/login.html" class="btn-outline">Entrar</a>
    </nav>
  </div>
</header>

<main class="container center">

  <section class="card login-card">
    <h1>Criar conta de Indicador</h1>

    <!-- FORMULÁRIO CORRETO -->
    <form method="POST" action="/cadastro">

      <label>Nome completo</label>
      <input
        type="text"
        name="nome"
        placeholder="Seu nome"
        required
      >

      <label>E-mail</label>
      <input
        type="email"
        name="email"
        placeholder="seu@email.com"
        required
      >

      <label>Senha</label>
      <input
        type="password"
        name="senha"
        placeholder="Crie uma senha segura"
        required
      >

      <label class="checkbox">
        <input type="checkbox" required>
        Li e aceito o
        <a href="/termos-indicador.html" target="_blank">Termo do Indicador</a>,
        o
        <a href="/termos-cliente.html" target="_blank">Termo do Cliente</a>
        e a
        <a href="/privacidade.html" target="_blank">Política de Privacidade</a>,
        autorizando contato do INDICONS e das administradoras parceiras.
      </label>

      <button class="btn btn-large" type="submit">
        Criar conta
      </button>

    </form>

    <p class="muted">
      Já possui conta?
      <a href="/login.html"><strong>Entrar</strong></a>
    </p>
  </section>

</main>

<footer class="footer-simple">
  © 2025 INDICONS • Plataforma de indicação de consórcios
</footer>

</body>
</html>
