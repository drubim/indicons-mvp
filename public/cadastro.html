<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h2>Cadastro de Cliente</h2>

<form id="formCadastro">
  <input type="text" id="nome" placeholder="Nome" required><br><br>
  <input type="text" id="telefone" placeholder="Telefone" required><br><br>
  <input type="email" id="email" placeholder="Email"><br><br>

  <button type="submit">Cadastrar</button>
</form>

<script>
  const form = document.getElementById("formCadastro");

  // captura indicador da URL
  const params = new URLSearchParams(window.location.search);
  const indicador = params.get("indicador");

  form.addEventListener("submit", function (e) {
    e.preventDefault(); // 🔴 ESSENCIAL

    fetch("/api/clientes", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        nome: document.getElementById("nome").value,
        telefone: document.getElementById("telefone").value,
        email: document.getElementById("email").value,
        indicador_codigo: indicador
      })
    })
    .then(res => res.json())
    .then(data => {
      alert("Cadastro realizado com sucesso");
      form.reset();
    })
    .catch(err => {
      alert("Erro no cadastro");
      console.error(err);
    });
  });
</script>

</body>
</html>
