<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
</head>
<body>

<h2>Cadastro de Indicador</h2>

<form id="cadastroForm">
  <input type="email" id="email" placeholder="E-mail" required><br><br>
  <input type="password" id="senha" placeholder="Senha" required><br><br>
  <button type="submit">Cadastrar</button>
</form>

<p id="erro" style="color:red;display:none;">Erro ao cadastrar</p>
<p id="ok" style="color:green;display:none;">Cadastro realizado</p>

<script>
document.getElementById('cadastroForm').addEventListener('submit', function(e) {
  e.preventDefault();

  fetch('/api/cadastro-indicador', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: email.value,
      senha: senha.value
    })
  })
  .then(res => {
    if (!res.ok) throw new Error();
    return res.json();
  })
  .then(() => {
    erro.style.display = 'none';
    ok.style.display = 'block';
  })
  .catch(() => {
    erro.style.display = 'block';
  });
});
</script>

</body>
</html>
