<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Indicador | INDICONS</title>
  <link rel="stylesheet" href="/indicador.css">
</head>
<body>

<header>
  <h1>INDICONS · Indicador</h1>
</header>

<main>

  <!-- BLOCO SUPERIOR -->
  <section class="box">
    <h2 id="nomeIndicador">Olá, Indicador</h2>

    <div class="link-box">
      <span>Seu link de indicação</span>
      <input type="text" id="linkIndicacao" readonly>
      <button onclick="copiarLink()">Copiar</button>
    </div>

    <!-- ETAPAS PREMIUM -->
    <div class="etapas">
      <div class="etapa registrado">🟡 Registrado</div>
      <div class="etapa andamento">🔵 Em andamento</div>
      <div class="etapa vendido">🟢 Vendido</div>
      <div class="etapa comissao">💰 Comissão</div>
    </div>
  </section>

  <!-- TABELA -->
  <section class="box">
    <h3>Minhas Indicações</h3>

    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Status</th>
          <th>Venda</th>
          <th>Minha comissão</th>
        </tr>
      </thead>
      <tbody id="listaIndicacoes">
        <tr>
          <td colspan="4">Carregando...</td>
        </tr>
      </tbody>
    </table>
  </section>

</main>

<script>
const params = new URLSearchParams(window.location.search);
const codigo = params.get('codigo');

fetch(`/indicador/${codigo}`)
  .then(res => res.json())
  .then(data => {
    // 🔒 Fallback contra undefined
    const nome = data.nome && data.nome.trim() !== '' ? data.nome : 'Indicador';
    document.getElementById('nomeIndicador').innerText = `Olá, ${nome}`;

    document.getElementById('linkIndicacao').value =
      `https://app.indicons.com.br/i/${data.codigo}`;

    const tbody = document.getElementById('listaIndicacoes');
    tbody.innerHTML = '';

    if (!data.indicacoes || data.indicacoes.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="4">Nenhuma indicação ainda</td></tr>';
      return;
    }

    data.indicacoes.forEach(lead => {
      const venda = lead.valorVenda
        ? `R$ ${Number(lead.valorVenda).toLocaleString('pt-BR')}`
        : '-';

      const comissao = lead.valorComissao
        ? `R$ ${Number(lead.valorComissao).toLocaleString('pt-BR')}`
        : '-';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${lead.nome}</td>
        <td>${lead.status}</td>
        <td>${venda}</td>
        <td>${comissao}</td>
      `;
      tbody.appendChild(tr);
    });
  })
  .catch(() => {
    document.getElementById('listaIndicacoes').innerHTML =
      '<tr><td colspan="4">Erro ao carregar dados</td></tr>';
  });

function copiarLink() {
  const input = document.getElementById('linkIndicacao');
  input.select();
  document.execCommand('copy');
  alert('Link copiado!');
}
</script>

</body>
</html>
