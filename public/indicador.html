<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Indicador</title>
</head>

<body>

  <h1>Meus Indicados</h1>

  <p>
    Meu link:
    <input type="text" id="meuLink" readonly style="width:350px;">
    <button onclick="copiarLink()">Copiar</button>
  </p>

  <table border="1" cellpadding="5">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Status</th>
        <th>Comissão</th>
        <th>Data</th>
      </tr>
    </thead>
    <tbody id="listaLeads"></tbody>
  </table>

  <br>
  <a href="/logout">Sair</a>

  <script>
    // 🔹 Carrega link do indicador (COM COOKIE)
    fetch('/api/indicador/link', {
      credentials: 'same-origin'
    })
      .then(res => {
        if (!res.ok) throw new Error();
        return res.json();
      })
      .then(data => {
        document.getElementById('meuLink').value = data.link;
      })
      .catch(() => {
        alert('Sessão expirada. Faça login novamente.');
        window.location.href = '/login.html';
      });

    // 🔹 Copiar link
    function copiarLink() {
      const input = document.getElementById('meuLink');
      input.select();
      document.execCommand('copy');
      alert('Link copiado!');
    }

    // 🔹 Carrega leads do indicador (COM COOKIE)
    fetch('/api/leads/indicador', {
      credentials: 'same-origin'
    })
      .then(res => res.json())
      .then(leads => {
        const tbody = document.getElementById('listaLeads');
        tbody.innerHTML = '';

        leads.forEach(l => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${l.nome}</td>
            <td>${l.status}</td>
            <td>${l.comissao || 0}</td>
            <td>${new Date(l.criadoEm).toLocaleString()}</td>
          `;
          tbody.appendChild(tr);
        });
      });
  </script>

</body>
</html>
