<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Indicador | INDICONS</title>
  <link rel="stylesheet" href="/indicador.css">
</head>
<body>

<header>
  <h1>INDICONS · Indicador</h1>
</header>

<main>
  <section class="box">
    <h2 id="nomeIndicador">Olá, Indicador</h2>

    <div class="link-box">
      <label>Seu link de indicação</label>
      <input type="text" id="linkIndicacao" readonly>
      <button onclick="copiarLink()">Copiar</button>
    </div>

    <div class="etapas">
      <div class="etapa registrado">🟡 Registrado</div>
      <div class="etapa contato">🔵 Em contato (IA)</div>
      <div class="etapa qualificado">🟠 Qualificado</div>
      <div class="etapa reuniao">🟢 Reunião agendada</div>
    </div>
  </section>

  <section class="box">
    <h3>Minhas Indicações</h3>
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Status</th>
          <th>Classificação</th>
        </tr>
      </thead>
      <tbody id="listaIndicacoes">
        <tr><td colspan="3">Carregando...</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script>
const codigo = new URLSearchParams(window.location.search).get('codigo');

fetch(`/indicador/${codigo}`)
  .then(r => r.json())
  .then(data => {
    document.getElementById('nomeIndicador').innerText = `Olá, ${data.nome}`;
    document.getElementById('linkIndicacao').value =
      `https://app.indicons.com.br/i/${data.codigo}`;

    const tbody = document.getElementById('listaIndicacoes');
    tbody.innerHTML = '';

    data.indicacoes.forEach(l => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${l.nome}</td>
        <td>${l.status}</td>
        <td>${l.classificacaoIA}</td>
      `;
      tbody.appendChild(tr);
    });
  });

function copiarLink() {
  const input = document.getElementById('linkIndicacao');
  input.select();
  document.execCommand('copy');
  alert('Link copiado!');
}
</script>

</body>
</html>
