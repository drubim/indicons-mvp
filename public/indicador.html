<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Indicador</title>
</head>
<body>

<h2 id="nome">Indicador</h2>

<table border="1" width="100%">
  <thead>
    <tr>
      <th>Cliente</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="lista">
    <tr><td colspan="2">Carregando...</td></tr>
  </tbody>
</table>

<script>
  const codigo = new URLSearchParams(window.location.search).get('codigo');

  fetch(`/indicador/${codigo}`)
    .then(r => r.json())
    .then(data => {
      document.getElementById('nome').innerText = data.nome || 'Indicador';

      const lista = document.getElementById('lista');
      lista.innerHTML = '';

      if (!data.indicacoes || data.indicacoes.length === 0) {
        lista.innerHTML =
          '<tr><td colspan="2">Nenhum lead ainda</td></tr>';
        return;
      }

      data.indicacoes.forEach(l => {
        lista.innerHTML += `
          <tr>
            <td>${l.nome}</td>
            <td>${l.status}</td>
          </tr>
        `;
      });
    });
</script>

</body>
</html>
