<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Indicador | INDICONS</title>
  <link rel="stylesheet" href="/indicador.css">
</head>
<body>

<header>
  <h1>INDICONS · Indicador</h1>
</header>

<main>
  <section class="box">
    <h2 id="nomeIndicador">Olá</h2>

    <div class="link-box">
      <label>Seu link de indicação</label>
      <input type="text" id="linkIndicacao" readonly>
      <button onclick="copiarLink()">Copiar</button>
    </div>

    <div class="etapas">
      <div class="etapa registrado">🟡 Registrado</div>
      <div class="etapa andamento">🔵 Em andamento</div>
      <div class="etapa vendido">🟢 Vendido</div>
      <div class="etapa comissao">💰 Comissão gerada</div>
    </div>
  </section>

  <section class="box">
    <h3>Minhas Indicações</h3>
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Status</th>
          <th>Venda</th>
          <th>Minha comissão</th>
        </tr>
      </thead>
      <tbody id="listaIndicacoes">
        <tr><td colspan="4">Carregando...</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script>
const codigo = new URLSearchParams(window.location.search).get('codigo');

fetch(`/indicador/${codigo}`)
  .then(r => r.json())
  .then(data => {
    const nome = data.nome || 'Indicador';
    document.getElementById('nomeIndicador').innerText = `Olá, ${nome}`;

    document.getElementById('linkIndicacao').value =
      `https://app.indicons.com.br/i/${data.codigo}`;

    const tbody = document.getElementById('listaIndicacoes');
    tbody.innerHTML = '';

    if (!data.indicacoes.length) {
      tbody.innerHTML = '<tr><td colspan="4">Nenhuma indicação ainda</td></tr>';
      return;
    }

    data.indicacoes.forEach(l => {
      const venda = l.valorVenda
        ? `R$ ${Number(l.valorVenda).toLocaleString('pt-BR')}`
        : '-';

      const comissao = l.valorComissao
        ? `R$ ${Number(l.valorComissao).toLocaleString('pt-BR')}`
        : '-';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${l.nome}</td>
        <td>${l.status}</td>
        <td>${venda}</td>
        <td>${comissao}</td>
      `;
      tbody.appendChild(tr);
    });
  });

function copiarLink() {
  const input = document.getElementById('linkIndicacao');
  input.select();
  document.execCommand('copy');
  alert('Link copiado!');
}
</script>

</body>
</html>
