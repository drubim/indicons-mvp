<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Indicador</title>
</head>
<body>

<h1>Painel Indicador</h1>

<p>Seu link de indicação:</p>
<p id="link"></p>

<script>
fetch('/api/meu-link')
  .then(res => res.json())
  .then(data => {
    document.getElementById('link').innerHTML =
      `<a href="${data.link}" target="_blank">${data.link}</a>`;
  });
</script>

<a href="/logout">Sair</a>

</body>
</html>
