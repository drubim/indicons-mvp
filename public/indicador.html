<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Indicador | INDICONS</title>
</head>
<body>

<h1>Painel do Indicador</h1>

<h2>Seu link de indicação</h2>
<p id="link"></p>

<h2>Seus Leads</h2>

<table border="1" cellpadding="8">
<thead>
<tr>
  <th>ID</th>
  <th>Nome</th>
  <th>Telefone</th>
  <th>Data</th>
</tr>
</thead>
<tbody id="leads"></tbody>
</table>

<br>
<a href="/logout">Sair</a>

<script>
// link
fetch('/api/indicador/link')
  .then(r => r.json())
  .then(d => {
    document.getElementById('link').innerHTML =
      `<a href="${d.link}" target="_blank">${d.link}</a>`;
  });

// leads
fetch('/api/leads/indicador')
  .then(r => r.json())
  .then(data => {
    const tbody = document.getElementById('leads');
    data.forEach(l => {
      tbody.innerHTML += `
        <tr>
          <td>${l.id}</td>
          <td>${l.nome}</td>
          <td>${l.telefone}</td>
          <td>${new Date(l.criadoEm).toLocaleString()}</td>
        </tr>`;
    });
  });
</script>

</body>
</html>
