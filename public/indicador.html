<script>
  const codigo = new URLSearchParams(window.location.search).get('codigo');

  if (!codigo) {
    alert('Acesso inválido. Faça login novamente.');
    window.location.href = '/login.html';
  } else {
    fetch(`/indicador/${codigo}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('nome').innerText = `Olá, ${data.nome}`;
        document.getElementById('nivel').innerText = `Nível: ${data.nivel}`;
        document.getElementById('link').value =
          `${window.location.origin}/i/${data.codigo}`;

        const lista = document.getElementById('lista');
        lista.innerHTML = '';

        if (data.indicacoes.length === 0) {
          lista.innerHTML = '<li>Nenhuma indicação ainda</li>';
        }

        data.indicacoes.forEach(i => {
          const li = document.createElement('li');
          li.innerText = `${icone(i.status)} ${i.nome} — ${i.status}`;
          lista.appendChild(li);
        });
      });
  }

  function icone(status) {
    if (status === 'Registrado') return '🟡';
    if (status === 'Em atendimento') return '🔵';
    if (status === 'Venda concluída') return '🟢';
    if (status === 'Não avançou') return '🔴';
    return '';
  }
</script>
