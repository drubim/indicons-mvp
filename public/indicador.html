<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Indicador</title>
</head>
<body>

<h1>Meus Indicados</h1>

<p><strong>Meu link:</strong></p>
<p id="link"></p>

<table border="1" cellpadding="8">
<thead>
<tr>
  <th>Nome</th>
  <th>Status</th>
  <th>Comissão</th>
  <th>Data</th>
</tr>
</thead>
<tbody id="leads"></tbody>
</table>

<br>
<a href="/logout">Sair</a>

<script>
fetch('/api/indicador/link')
  .then(r => r.json())
  .then(d => document.getElementById('link').innerText = d.link);

fetch('/api/leads/indicador')
  .then(r => r.json())
  .then(data => {
    const tb = document.getElementById('leads');
    data.forEach(l => {
      tb.innerHTML += `
        <tr>
          <td>${l.nome}</td>
          <td>${l.status}</td>
          <td>R$ ${Number(l.comissao).toFixed(2)}</td>
          <td>${new Date(l.criadoEm).toLocaleDateString()}</td>
        </tr>`;
    });
  });
</script>

</body>
</html>
