<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Indicador | INDICONS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 4px;
    }

    .sub {
      color: #6b7280;
      margin-bottom: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nivel {
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      background: #e5e7eb;
    }

    .nivel.Ativo { background: #e5e7eb; }
    .nivel.Destaque { background: #fef3c7; }
    .nivel.Premium { background: #dcfce7; }

    .link-box {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .link-box input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }

    .link-box button {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .link-box button:hover {
      background: #1d4ed8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 13px;
      color: #6b7280;
      padding-bottom: 10px;
    }

    td {
      padding: 12px 6px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .status {
      font-weight: bold;
    }

    .Registrado { color: #ca8a04; }      /* 🟡 */
    .Em { color: #2563eb; }               /* 🔵 */
    .Venda { color: #16a34a; }             /* 🟢 */
    .Não { color: #dc2626; }               /* 🔴 */

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 20px;
    }

    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }
      th { display: none; }
      td { border: none; }
      tr { margin-bottom: 16px; }
    }
  </style>
</head>

<body>
<div class="container">

  <h1 id="nome">Olá</h1>
  <div class="sub">Acompanhe suas indicações em tempo real</div>

  <div class="card top">
    <div>
      <strong>Seu link de indicação</strong>
      <div class="link-box">
        <input id="link" readonly>
        <button onclick="copiar()">Copiar</button>
      </div>
    </div>

    <div id="nivel" class="nivel"></div>
  </div>

  <div class="card">
    <h3>Minhas Indicações</h3>

    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="lista">
        <tr><td colspan="2" class="empty">Carregando...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  const codigo = new URLSearchParams(window.location.search).get('codigo');

  if (!codigo) {
    alert('Acesso inválido. Faça login novamente.');
    window.location.href = '/login.html';
  }

  fetch(`/indicador/${codigo}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById('nome').innerText = `Olá, ${data.nome}`;
      document.getElementById('nivel').innerText = `Nível: ${data.nivel}`;
      document.getElementById('nivel').classList.add(data.nivel);
      document.getElementById('link').value =
        `${window.location.origin}/i/${data.codigo}`;

      const tbody = document.getElementById('lista');
      tbody.innerHTML = '';

      if (data.indicacoes.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="2" class="empty">Nenhuma indicação ainda</td></tr>';
        return;
      }

      data.indicacoes.forEach(i => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i.nome}</td>
          <td class="status ${i.status.split(' ')[0]}">
            ${icone(i.status)} ${i.status}
          </td>
        `;
        tbody.appendChild(tr);
      });
    });

  function copiar() {
    const input = document.getElementById('link');
    input.select();
    document.execCommand('copy');
    alert('Link copiado!');
  }

  function icone(status) {
    if (status === 'Registrado') return '🟡';
    if (status === 'Em atendimento') return '🔵';
    if (status === 'Venda concluída') return '🟢';
    if (status === 'Não avançou') return '🔴';
    return '';
  }
</script>

</body>
</html>
