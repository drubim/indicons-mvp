<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Indicador</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./dashboard-indicador.css">
</head>
<body>

<div class="container">

  <header> 
    <h1>Painel do Indicador</h1>
    <p>Acompanhe suas indicações e comissões</p>
  </header>

  <section class="link-box">
    <label>Seu link de indicação</label>
    <div class="link-row">
      <input id="linkIndicador" readonly>
      <button id="copiar">Copiar link</button>
    </div>
    <span id="msg">Link copiado com sucesso</span>
  </section>

  <section class="cards">
    <div class="card">Registrado <strong id="r">0</strong></div>
    <div class="card andamento">Em andamento <strong id="a">0</strong></div>
    <div class="card vendido">Vendido <strong id="v">0</strong></div>
    <div class="card comissao">Comissão <strong id="c">R$ 0,00</strong></div>
  </section>

  <table>
    <thead>
      <tr>
        <th>Cliente</th>
        <th>Status</th>
        <th>Valor</th>
        <th>Comissão</th>
