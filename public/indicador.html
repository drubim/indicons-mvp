<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Indicador | INDICONS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .sub {
      color: #6b7280;
      margin-bottom: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      font-size: 14px;
    }

    button {
      margin-top: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }
  </style>
</head>

<body>

<h1 id="nome">Olá</h1>
<div class="sub">Acompanhe suas indicações em tempo real</div>

<div class="card">
  <strong>Seu link de indicação</strong>
  <input id="link" readonly>
  <button onclick="copiar()">Copiar</button>
</div>

<div class="card">
  <h3>Minhas Indicações</h3>
  <table>
    <thead>
      <tr>
        <th>Cliente</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="lista">
      <tr><td colspan="2">Carregando...</td></tr>
    </tbody>
  </table>
</div>

<script>
  const codigo = new URLSearchParams(window.location.search).get('codigo');

  if (!codigo) {
    alert('Acesso inválido. Faça login novamente.');
    window.location.href = '/login.html';
  }

  fetch(`/indicador/${codigo}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById('nome').innerText = `Olá, ${data.nome}`;
      document.getElementById('link').value =
        `${window.location.origin}/i/${data.codigo}`;

      const lista = document.getElementById('lista');
      lista.innerHTML = '';

      if (data.indicacoes.length === 0) {
        lista.innerHTML =
          '<tr><td colspan="2">Nenhuma indicação ainda</td></tr>';
        return;
      }

      data.indicacoes.forEach(l => {
        lista.innerHTML += `
          <tr>
            <td>${l.nome}</td>
            <td>${l.status}</td>
          </tr>
        `;
      });
    })
    .catch(() => {
      document.getElementById('lista').innerHTML =
        '<tr><td colspan="2">Erro ao carregar dados</td></tr>';
    });

  function copiar() {
    const input = document.getElementById('link');
    input.select();
    document.execCommand('copy');
    alert('Link copiado!');
  }
</script>

</body>
</html>
