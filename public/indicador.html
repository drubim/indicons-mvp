<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Painel do Indicador</title>

      <h1>Painel do Indicador</h1>
      <p>Acompanhe suas indicações e comissões</p>

    <section class="link-box">
      <label>Seu link de indicação</label>
      <div class="link-row">
        <input type="text" id="linkIndicador" readonly />
        <button onclick="copiarLink()">Copiar link</button>
      </div>
      <span id="copiadoMsg" class="copiado">Link copiado com sucesso</span>
    </section>

    <!-- CARDS -->
    <section class="cards">
      <div class="card">
        <span>Registrado</span>
        <strong id="qtdRegistrado">0</strong>
      </div>

      <div class="card andamento">
        <span>Em andamento</span>
        <strong id="qtdAndamento">0</strong>
      </div>

      <div class="card vendido">
        <span>Vendido</span>
        <strong id="qtdVendido">0</strong>
      </div>

      <div class="card comissao">
        <span>Comissão</span>
        <strong id="totalComissao">R$ 0,00</strong>
      </div>
    </section>
