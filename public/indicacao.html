<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Simulação Gratuita | INDICONS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 420px;
      margin: 60px auto;
      background: #ffffff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      color: #1f2937;
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      color: #4b5563;
      font-size: 15px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .info {
      font-size: 12px;
      color: #6b7280;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Planeje sua conquista sem juros abusivos</h1>
    <p>Receba uma simulação gratuita e sem compromisso.</p>

    <form id="indicacaoForm">
      <input type="text" id="nome" placeholder="Seu nome" required />
      <input type="tel" id="whatsapp" placeholder="WhatsApp (com DDD)" required />
      <button type="submit">Quero entender meu consórcio</button>
    </form>

    <div class="info">
      Atendimento humano após a simulação. Seus dados estão protegidos.
    </div>
  </div>

  <script>
    document.getElementById('indicacaoForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const nome = document.getElementById('nome').value;
      const whatsapp = document.getElementById('whatsapp').value;

      const res = await fetch('/indicacao', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, whatsapp })
      });

      if (res.ok) {
        alert('Recebemos seus dados! Em instantes um especialista entrará em contato.');
        document.getElementById('indicacaoForm').reset();
      } else {
        alert('Erro ao enviar. Tente novamente.');
      }
    });
  </script>
</body>
</html>
