<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Indicação | INDICONS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 20px; }
    .box {
      max-width: 420px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 14px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Receba uma proposta</h2>
  <p>Preencha seus dados para falarmos com você.</p>

  <form id="form">
    <input id="nome" placeholder="Seu nome" required>
    <input id="whatsapp" placeholder="WhatsApp com DDD" required>
    <button type="submit">Enviar</button>
  </form>
</div>

<script>
  // 🔴 ESSENCIAL — PEGA O CÓDIGO DO INDICADOR
  const codigoIndicador = window.location.pathname.split('/').pop();

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const nome = document.getElementById('nome').value;
    const whatsapp = document.getElementById('whatsapp').value;

    const res = await fetch('/indicacao', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nome,
        whatsapp,
        codigoIndicador
      })
    });

    if (res.ok) {
      alert('Cadastro enviado! Em breve entraremos em contato.');
      document.getElementById('form').reset();
    } else {
      alert('Erro ao enviar. Tente novamente.');
    }
  });
</script>

</body>
</html>
