<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Simulação Gratuita | INDICONS</title>
</head>
<body>

<h2>Planeje sua conquista sem juros abusivos</h2>
<p>Simulação gratuita e sem compromisso</p>

<form id="indicacaoForm">
  <input type="text" id="nome" placeholder="Seu nome" required><br><br>
  <input type="tel" id="whatsapp" placeholder="WhatsApp com DDD" required><br><br>
  <button type="submit">Quero entender meu consórcio</button>
</form>

<script>
  const codigoIndicador = window.location.pathname.split('/').pop();

  document.getElementById('indicacaoForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const nome = document.getElementById('nome').value;
    const whatsapp = document.getElementById('whatsapp').value;

    const res = await fetch('/indicacao', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome, whatsapp, codigoIndicador })
    });

    if (res.ok) {
      alert('Recebemos seus dados! Em breve entraremos em contato.');
      document.getElementById('indicacaoForm').reset();
    } else {
      alert('Erro ao enviar. Tente novamente.');
    }
  });
</script>

</body>
</html>
