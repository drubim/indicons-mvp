<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Indicador | INDICONS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="header">
  <div class="container header-flex">
    <div class="logo">INDICONS</div>
    <nav>
      <a href="/simulador.html">Simulador</a>
      <a href="/logout">Sair</a>
    </nav>
  </div>
</header>

<main class="container">

  <h1>Painel do Indicador</h1>

  <div class="grid-3">
    <div class="card">
      <h4>Pré-adesões</h4>
      <strong id="pre">0</strong>
    </div>
    <div class="card">
      <h4>Vendas aprovadas</h4>
      <strong id="vend">0</strong>
    </div>
    <div class="card">
      <h4>Comissões previstas</h4>
      <strong id="com">R$ 0</strong>
    </div>
  </div>

  <div class="card">
    <h3>Funil de indicações</h3>
    <canvas id="funil"></canvas>
  </div>

</main>

<script>
fetch("/api/dashboard")
  .then(r => r.json())
  .then(d => {
    document.getElementById("pre").innerText = d.pre;
    document.getElementById("vend").innerText = d.vendas;
    document.getElementById("com").innerText = "R$ " + d.comissao.toFixed(2);

    new Chart(document.getElementById("funil"), {
      type: "bar",
      data: {
        labels: ["Pré-adesão", "Atendimento", "Venda", "Pagamento"],
        datasets: [{
          label: "Quantidade",
          data: d.funil,
          backgroundColor: "#2563eb"
        }]
      }
    });
  });
</script>

</body>
</html>
