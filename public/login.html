<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>

<h2>Login</h2>

<form id="loginForm">
  <input type="email" id="email" placeholder="E-mail" required><br><br>
  <input type="password" id="senha" placeholder="Senha" required><br><br>
  <button type="submit">Entrar</button>
</form>

<p id="erro" style="color:red;display:none;">Login inválido</p>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: email.value,
      senha: senha.value
    })
  })
  .then(res => {
    if (!res.ok) throw new Error();
    return res.json();
  })
  .then(data => {
    if (data.role === 'admin') location.href = '/admin.html';
    if (data.role === 'parceiro') location.href = '/parceiro.html';
    if (data.role === 'indicador') location.href = '/indicador.html';
  })
  .catch(() => {
    document.getElementById('erro').style.display = 'block';
  });
});
</script>

</body>
</html>
