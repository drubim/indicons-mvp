<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Entrar | INDICONS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="container header-flex">
    <div class="logo">INDICONS</div>
    <nav>
      <a href="/">Home</a>
      <a href="/simulador.html">Simulador</a>
      <a href="/cadastro.html" class="btn-outline">Criar conta</a>
    </nav>
  </div>
</header>

<main class="container center">

  <section class="card login-card">
    <h1>Acessar plataforma</h1>

    <!-- FORMULÁRIO CORRETO -->
    <form method="POST" action="/login">

      <label>E-mail</label>
      <input
        type="email"
        name="email"
        placeholder="seu@email.com"
        required
      >

      <label>Senha</label>
      <input
        type="password"
        name="senha"
        placeholder="••••••••"
        required
      >

      <button class="btn btn-large" type="submit">
        Entrar
      </button>

    </form>

    <p class="muted">
      Ainda não é indicador?
      <a href="/cadastro.html"><strong>Criar conta</strong></a>
    </p>
  </section>

</main>

<footer class="footer-simple">
  © 2025 INDICONS • Plataforma de indicação de consórcios
</footer>

</body>
</html>
