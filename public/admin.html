<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Admin | INDICONS</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>

<header>
  <h1>INDICONS · Admin</h1>
</header>

<main class="box">
  <h2>Leads Registrados</h2>

  <table>
    <thead>
      <tr>
        <th>Cliente</th>
        <th>Indicador</th>
        <th>Classificação IA</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="adminLeads">
      <tr><td colspan="4">Carregando...</td></tr>
    </tbody>
  </table>
</main>

<script>
fetch('/admin/leads')
  .then(r => r.json())
  .then(leads => {
    const tbody = document.getElementById('adminLeads');
    tbody.innerHTML = '';

    leads.forEach(l => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${l.nome}</td>
        <td>${l.indicadorNome}</td>
        <td>${l.classificacaoIA}</td>
        <td>${l.status}</td>
      `;
      tbody.appendChild(tr);
    });
  });
</script>

</body>
</html>
