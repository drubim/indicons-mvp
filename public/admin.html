<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Admin INDICONS</title>
</head>
<body>

<h2>Leads Registrados</h2>

<table border="1" width="100%">
  <thead>
    <tr>
      <th>Cliente</th>
      <th>Indicador</th>
      <th>Status</th>
      <th>Venda</th>
      <th>Comissão</th>
    </tr>
  </thead>
  <tbody id="lista"></tbody>
</table>

<script>
fetch('/admin/leads')
  .then(r => r.json())
  .then(leads => {
    const tbody = document.getElementById('lista');
    tbody.innerHTML = '';

    leads.forEach(l => {
      tbody.innerHTML += `
        <tr>
          <td>${l.nome}</td>
          <td>${l.indicadorNome}</td>
          <td>${l.status}</td>
          <td>${l.valorVenda ? 'R$ ' + l.valorVenda : '-'}</td>
          <td>${l.valorComissao ? 'R$ ' + l.valorComissao.toFixed(2) : '-'}</td>
        </tr>
      `;
    });
  });
</script>

</body>
</html>
