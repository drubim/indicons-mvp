<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>INDICONS · Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 20px; }
h1 { margin-bottom: 20px; }

.cards {
  display: flex;
  gap: 20px;
  margin-bottom: 30px;
}

.card {
  background: #fff;
  padding: 18px;
  border-radius: 12px;
  min-width: 180px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

.card span { font-size: 26px; font-weight: bold; }

table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  margin-bottom: 30px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #e5e7eb;
  text-align: left;
}

th {
  background: #111827;
  color: #fff;
}
</style>
</head>

<body>

<h1>INDICONS · Admin</h1>

<div class="cards">
  <div class="card">Usuários<br><span id="totalUsuarios">0</span></div>
  <div class="card">Leads<br><span id="totalLeads">0</span></div>
</div>

<h2>Usuários cadastrados</h2>
<table>
  <thead>
    <tr>
      <th>Nome</th>
      <th>Email</th>
      <th>Tipo</th>
    </tr>
  </thead>
  <tbody id="usuarios"></tbody>
</table>

<h2>Leads registrados</h2>
<table>
  <thead>
    <tr>
      <th>Cliente</th>
      <th>Indicador</th>
      <th>Status</th>
      <th>IA</th>
    </tr>
  </thead>
  <tbody id="leads"></tbody>
</table>

<script>
fetch('/admin/usuarios')
  .then(r => r.json())
  .then(lista => {
    document.getElementById('totalUsuarios').innerText = lista.length;
    const tbody = document.getElementById('usuarios');
    lista.forEach(u => {
      tbody.innerHTML += `
        <tr>
          <td>${u.nome}</td>
          <td>${u.email}</td>
          <td>${u.tipo}</td>
        </tr>`;
    });
  });

fetch('/admin/leads')
  .then(r => r.json())
  .then(leads => {
    document.getElementById('totalLeads').innerText = leads.length;
    const tbody = document.getElementById('leads');

    if (leads.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="4">Nenhum lead registrado</td></tr>';
      return;
    }

    leads.forEach(l => {
      tbody.innerHTML += `
        <tr>
          <td>${l.nome}</td>
          <td>${l.indicadorNome}</td>
          <td>${l.status}</td>
          <td>${l.classificacaoIA}</td>
        </tr>`;
    });
  });
</script>

</body>
</html>
